<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6ee">
  <meta name="description" content="Purl Pal is a cozy knitting and crochet row counter. Tap once per row, track repeats, and keep every project in your pocket.">
  <title>Purl Pal — knitting row counter</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-color="blush">
  <main class="app">
    <header class="hero">
      <svg id="sheep" class="sheep" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse cx="60" cy="98" rx="22" ry="6" fill="#e8d4c4"/>
        <path d="M38 74c-8 0-14-7-14-16 0-6 3-11 8-14-1-8 5-16 14-16 4 0 7 1 10 4 3-6 10-10 18-9 9 1 15 8 16 16 6 1 11 7 11 14 0 9-7 16-16 16H38z" fill="#fff"/>
        <circle cx="46" cy="52" r="11" fill="#fff"/>
        <circle cx="62" cy="44" r="13" fill="#fff"/>
        <circle cx="78" cy="54" r="12" fill="#fff"/>
        <circle cx="56" cy="62" r="12" fill="#fff"/>
        <circle cx="72" cy="64" r="10" fill="#fff"/>
        <path d="M84 62c8 1 18 8 16 18-2 8-12 10-20 7" fill="#f4c7b8"/>
        <ellipse cx="96" cy="74" rx="10" ry="9" fill="#f4c7b8"/>
        <circle cx="99" cy="71" r="1.4" fill="#3a2a26"/>
        <circle cx="93" cy="71.5" r="1.4" fill="#3a2a26"/>
        <path d="M93 76c2 2 5 2 7 0" fill="none" stroke="#c46b5a" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M40 86c0 8-4 14-9 14s-8-5-7-12" fill="#f4c7b8"/>
        <path d="M70 88c2 8-1 14-6 14s-8-6-7-13" fill="#f4c7b8"/>
        <circle cx="38" cy="34" r="5" fill="#e89b8c"/>
        <circle cx="82" cy="32" r="4.5" fill="#7a9466"/>
        <circle cx="28" cy="54" r="4" fill="#e0b15a"/>
      </svg>
      <div class="titles">
        <h1>Purl Pal</h1>
        <p>A tiny sheep who counts your rows.</p>
      </div>
    </header>

    <section class="card" aria-label="Projects">
      <div class="project-row">
        <div id="project-list" class="project-list"></div>
        <button id="add-project" class="icon-btn" type="button" aria-label="Add project">+</button>
      </div>
    </section>

    <section class="card counter-card" aria-live="polite">
      <div id="celebrate" class="celebrate" hidden></div>
      <p id="reminder-banner" class="reminder" hidden></p>
      <div id="row-number" class="row-number">0</div>
      <p id="row-label" class="row-label">rows</p>
      <button id="increment" class="big-plus" type="button">Finished a row</button>
      <div class="control-row">
        <button id="decrement" type="button">− 1</button>
        <button id="plus-ten" type="button">+ 10</button>
        <button id="undo" type="button">Undo</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </section>

    <section class="card">
      <div class="field">
        <label for="project-name">Project name</label>
        <input id="project-name" type="text" maxlength="48" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="repeat-every">Repeat every</label>
          <input id="repeat-every" type="number" min="1" max="400" inputmode="numeric" placeholder="8 rows">
          <div class="meter" aria-hidden="true"><span id="repeat-fill"></span></div>
          <p id="repeat-status" class="status tiny"></p>
        </div>
        <div class="field">
          <label for="goal">Goal row</label>
          <input id="goal" type="number" min="1" max="9999" inputmode="numeric" placeholder="80">
          <div class="meter" aria-hidden="true"><span id="goal-fill"></span></div>
          <p id="goal-status" class="status tiny"></p>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="reminder-row">Nudge me on row</label>
          <input id="reminder-row" type="number" min="1" max="9999" inputmode="numeric" placeholder="20">
        </div>
        <div class="field">
          <label for="reminder-text">Reminder</label>
          <input id="reminder-text" type="text" maxlength="80" placeholder="Switch to contrast yarn">
        </div>
      </div>
      <div class="field">
        <label for="notes">Pocket notes</label>
        <textarea id="notes" maxlength="400" placeholder="US 4 needles, leftover sock yarn, cable on WS…"></textarea>
      </div>
      <button id="delete-project" class="ghost-btn" type="button">Delete this project</button>
    </section>

    <section class="card">
      <div class="toggles">
        <label class="toggle">
          <span>Keep the screen awake while I knit</span>
          <input id="keep-awake" type="checkbox">
        </label>
        <label class="toggle">
          <span>Haptic taps on supported phones</span>
          <input id="haptics" type="checkbox" checked>
        </label>
      </div>
    </section>

    <p class="footnote">Space or + adds a row. − subtracts. Everything stays on this device.</p>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/counter.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
